# Cloudflare Worker — 家居储存管理 API
name = "home-storage-api"
main = "index.js"
compatibility_date = "2024-12-01"

# D1 数据库绑定（部署前需先创建 D1 数据库）
# 命令: npx wrangler d1 create home-storage-db
[[d1_databases]]
binding = "DB"
database_name = "home-storage-db"
database_id = "a58f5cd0-cc51-4e6b-980d-4aa413e648b1"  # home-storage-db

# 路由（可选，部署后会自动生成 xxx.workers.dev 子域名）
# routes = []

# 环境变量/密钥
# API_KEY 用 Secret 管理，不用明文写在 toml 里
# 命令: npx wrangler secret put API_KEY
